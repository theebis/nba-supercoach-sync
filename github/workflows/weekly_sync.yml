name: Weekly NBA SuperCoach Rollover Sync (AEDT)

on:
  schedule:
    # 1) 6:00 PM AEDT Monday (07:00 UTC Monday) - Right after final Monday AEDT NBA games & SC price rollover
    - cron: '0 7 * * 1'
    # 2) 8:00 PM AEDT Monday (09:00 UTC Monday) - Backup sync in case SC lockout ran late (ready for Monday night trade planning!)
    - cron: '0 9 * * 1'
    # 3) 8:00 AM AEDT Tuesday (21:00 UTC Monday) - Final morning check ~3 hrs before Tuesday ~11am AEDT tip-off lockout
    - cron: '0 21 * * 1'
  workflow_dispatch: # Lets you trigger a manual 1-click sync anytime on GitHub

permissions:
  contents: write

jobs:
  sync-supercoach-players:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Scrape All 450+ NBA SuperCoach Players & Weekly Scores
        env:
          SC_BEARER_TOKEN: ${{ secrets.SC_BEARER_TOKEN }}
        run: python update_supercoach.py

      - name: Commit & Push Updated supercoach_data.json
        run: |
          git config --global user.name 'SuperCoach Auto-Sync Bot'
          git config --global user.email 'actions@github.com'
          git add supercoach_data.json
          git diff --staged --quiet || git commit -m "Weekly AEDT SuperCoach 450+ player price & breakeven sync"
          git push
