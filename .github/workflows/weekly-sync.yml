name: Weekly SuperCoach Data Sync

on:
  schedule:
    # Runs Monday at 08:00 UTC (7:00 PM AEDT)
    - cron: '0 8 * * 1'
    # Runs Monday at 15:00 UTC (2:00 AM AEDT Tuesday morning)
    - cron: '0 15 * * 1'
    # Daily at 22:00 UTC (9:00 AM AEDT) to keep ESPN injury statuses current
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" to test
  # Refresh the data straight away whenever the scraper itself changes on main
  push:
    branches:
      - main
    paths:
      - 'update_supercoach.py'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install curl_cffi

      - name: Run SuperCoach Scraper
        env:
          SC_BEARER_TOKEN: ${{ secrets.SC_BEARER_TOKEN }}
        run: python update_supercoach.py

      - name: Commit and push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add supercoach_data.json history/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: weekly SuperCoach data rollover" && git push)
